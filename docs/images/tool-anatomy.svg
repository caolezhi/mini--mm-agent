<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="100%" height="100%" fill="#ffffff"/><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#e9f4ff"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fff9"/><stop offset="1" stop-color="#e5faef"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf9ff"/><stop offset="1" stop-color="#eee8ff"/></linearGradient><linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#fff2cd"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b95eb"/></marker><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7158e8"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#22af80"/></marker></defs><style>.title{font:700 43px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#123b86}.sub{font:500 21px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#647ba8}.label{font:700 24px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#102d64}.small{font:500 16px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#60749a}.mono{font:600 17px Consolas,"SFMono-Regular",monospace;fill:#483a9f}.arrow{fill:none;stroke:#3b95eb;stroke-width:4;stroke-linecap:round;marker-end:url(#a)}.arrowP{fill:none;stroke:#7158e8;stroke-width:4;stroke-linecap:round;marker-end:url(#p)}.arrowG{fill:none;stroke:#22af80;stroke-width:4;stroke-linecap:round;marker-end:url(#g)}</style><text x="700" y="60" text-anchor="middle" class="title">一个普通 Python 函数是怎样变成 Tool 的？</text><text x="700" y="98" text-anchor="middle" class="sub">模型看“说明书”，程序执行“真实函数”</text><line x1="500" y1="114" x2="900" y2="114" stroke="#9aacef" stroke-width="3" stroke-linecap="round"/><rect x="65" y="190" width="270" height="185" rx="22" fill="url(#green)" stroke="#27b67d" stroke-width="2"/><text x="200" y="230" text-anchor="middle" class="label">① Python 函数</text><text x="200" y="272" text-anchor="middle" class="mono">def add_numbers(a, b)</text><text x="200" y="310" text-anchor="middle" class="small">真正可以执行的能力</text><text x="200" y="340" text-anchor="middle" class="small">模型本身看不到函数源码</text><path d="M335 282 H430" class="arrow"/><rect x="440" y="175" width="300" height="215" rx="22" fill="url(#yellow)" stroke="#e4a522" stroke-width="2"/><text x="590" y="220" text-anchor="middle" class="label">② Tool Definition</text><text x="590" y="260" text-anchor="middle" class="mono">name / description</text><text x="590" y="292" text-anchor="middle" class="mono">parameters / required</text><text x="590" y="335" text-anchor="middle" class="small">这是给模型看的“工具说明书”</text><text x="590" y="365" text-anchor="middle" class="small">告诉模型：工具叫什么、何时用、要哪些参数</text><path d="M740 282 H835" class="arrowP"/><rect x="845" y="190" width="250" height="185" rx="22" fill="url(#purple)" stroke="#8065e8" stroke-width="2"/><text x="970" y="230" text-anchor="middle" class="label">③ function_call</text><text x="970" y="273" text-anchor="middle" class="mono">name = add_numbers</text><text x="970" y="305" text-anchor="middle" class="mono">arguments = {...}</text><text x="970" y="342" text-anchor="middle" class="small">模型只是在“提出调用请求”</text><path d="M1095 282 H1190" class="arrow"/><rect x="1200" y="190" width="150" height="185" rx="22" fill="url(#blue)" stroke="#56a9ef" stroke-width="2"/><text x="1275" y="230" text-anchor="middle" class="label">④ Executor</text><text x="1275" y="276" text-anchor="middle" class="small">解析参数</text><text x="1275" y="308" text-anchor="middle" class="small">找到函数</text><text x="1275" y="340" text-anchor="middle" class="small">真正执行</text><rect x="220" y="485" width="960" height="170" rx="24" fill="#fbfdff" stroke="#cad9ed" stroke-width="2" stroke-dasharray="7 7"/><text x="700" y="528" text-anchor="middle" class="label">最重要的区别</text><text x="700" y="575" text-anchor="middle" class="small">Tool Definition ≠ Python 函数；function_call ≠ 已经执行</text><text x="700" y="615" text-anchor="middle" class="small">LLM 负责选择动作，Python 程序负责真正执行动作</text><path d="M1275 375 V430 H200 V410" class="arrowG"/><text x="735" y="448" text-anchor="middle" class="small">执行结果随后会作为 function_call_output 再交回模型</text></svg>