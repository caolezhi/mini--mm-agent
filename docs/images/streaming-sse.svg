<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><rect width="100%" height="100%" fill="#fff"/><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#e8f4ff"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf9ff"/><stop offset="1" stop-color="#eee8ff"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fff9"/><stop offset="1" stop-color="#e5faef"/></linearGradient><linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#fff2cd"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b95eb"/></marker><marker id="arrowP" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7158e8"/></marker></defs><style>.title{font:700 43px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#123b86}.sub{font:500 21px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#647ba8}.label{font:700 22px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#102d64}.small{font:500 16px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#60749a}.mono{font:600 17px Consolas,"SFMono-Regular",monospace;fill:#533fb8}.arrow{fill:none;stroke:#3b95eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.arrowP{fill:none;stroke:#7158e8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowP)}</style><text x="700" y="60" text-anchor="middle" class="title">流式输出是怎样到浏览器的？</text><text x="700" y="98" text-anchor="middle" class="sub">Responses API Streaming + FastAPI + SSE</text><line x1="525" y1="114" x2="875" y2="114" stroke="#9aacef" stroke-width="3" stroke-linecap="round"/><rect x="55" y="190" width="220" height="145" rx="22" fill="url(#purple)" stroke="#8065e8" stroke-width="2"/><text x="165" y="235" text-anchor="middle" class="label">Responses API</text><text x="165" y="272" text-anchor="middle" class="small">stream=True</text><text x="165" y="305" text-anchor="middle" class="mono">output_text.delta</text><path d="M275 262 H370" class="arrowP"/><rect x="380" y="190" width="230" height="145" rx="22" fill="url(#blue)" stroke="#56a9ef" stroke-width="2"/><text x="495" y="235" text-anchor="middle" class="label">Python 异步生成器</text><text x="495" y="274" text-anchor="middle" class="small">async for event in stream</text><text x="495" y="307" text-anchor="middle" class="mono">yield event.delta</text><path d="M610 262 H705" class="arrow"/><rect x="715" y="190" width="230" height="145" rx="22" fill="url(#yellow)" stroke="#e4a522" stroke-width="2"/><text x="830" y="235" text-anchor="middle" class="label">FastAPI</text><text x="830" y="274" text-anchor="middle" class="small">StreamingResponse</text><text x="830" y="307" text-anchor="middle" class="mono">text/event-stream</text><path d="M945 262 H1040" class="arrow"/><rect x="1050" y="190" width="295" height="145" rx="22" fill="url(#green)" stroke="#25b67d" stroke-width="2"/><text x="1198" y="235" text-anchor="middle" class="label">浏览器 / curl</text><text x="1198" y="275" text-anchor="middle" class="small">服务器发一点，就马上收到一点</text><text x="1198" y="309" text-anchor="middle" class="mono">data: {"delta":"..."}</text><rect x="240" y="425" width="920" height="205" rx="24" fill="#fbfdff" stroke="#cddcf1" stroke-width="2" stroke-dasharray="7 7"/><text x="700" y="468" text-anchor="middle" class="label">同一份回答还要在后台拼成完整文本</text><text x="700" y="515" text-anchor="middle" class="mono">full_reply += event.delta</text><path d="M470 550 H640" class="arrow"/><rect x="300" y="535" width="170" height="65" rx="16" fill="url(#blue)" stroke="#56a9ef" stroke-width="2"/><text x="385" y="576" text-anchor="middle" class="small">一块一块返回前端</text><rect x="650" y="535" width="220" height="65" rx="16" fill="url(#purple)" stroke="#8065e8" stroke-width="2"/><text x="760" y="576" text-anchor="middle" class="small">最终拼成 full_reply</text><path d="M870 567 H970" class="arrowP"/><rect x="980" y="535" width="130" height="65" rx="16" fill="url(#green)" stroke="#25b67d" stroke-width="2"/><text x="1045" y="576" text-anchor="middle" class="small">保存 SQLite</text><text x="700" y="680" text-anchor="middle" class="sub">核心：模型流 → async for → yield → SSE → 客户端；完整文本在服务端另行累积</text></svg>