<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="100%" height="100%" fill="#fff"/><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#e8f4ff"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf9ff"/><stop offset="1" stop-color="#eee8ff"/></linearGradient><linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffafd"/><stop offset="1" stop-color="#ffe8f1"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fff9"/><stop offset="1" stop-color="#e5faef"/></linearGradient><linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#fff2cd"/></linearGradient><marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b95eb"/></marker><marker id="arrowP" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7158e8"/></marker></defs><style>.title{font:700 42px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#123b86}.sub{font:500 21px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#647ba8}.label{font:700 22px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#102d64}.small{font:500 16px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#60749a}.mono{font:600 17px Consolas,"SFMono-Regular",monospace;fill:#533fb8}.arrow{fill:none;stroke:#3b95eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowB)}.arrowP{fill:none;stroke:#7158e8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowP)}</style><text x="700" y="58" text-anchor="middle" class="title">为什么模型生成的代码要放进 Sandbox？</text><text x="700" y="94" text-anchor="middle" class="sub">把“会生成代码”与“能在真实服务器上任意执行”隔开</text><line x1="500" y1="110" x2="900" y2="110" stroke="#9aacef" stroke-width="3" stroke-linecap="round"/><rect x="55" y="190" width="215" height="140" rx="22" fill="url(#purple)" stroke="#8065e8" stroke-width="2"/><text x="162" y="235" text-anchor="middle" class="label">Responses API</text><text x="162" y="275" text-anchor="middle" class="small">模型决定使用</text><text x="162" y="304" text-anchor="middle" class="mono">run_python</text><path d="M270 260 H360" class="arrowP"/><rect x="370" y="190" width="250" height="140" rx="22" fill="url(#blue)" stroke="#56a9ef" stroke-width="2"/><text x="495" y="235" text-anchor="middle" class="label">Tool Executor</text><text x="495" y="274" text-anchor="middle" class="small">解析 code 参数</text><text x="495" y="304" text-anchor="middle" class="small">找到 run_python()</text><path d="M620 260 H710" class="arrow"/><rect x="720" y="155" width="315" height="210" rx="28" fill="url(#pink)" stroke="#d95b98" stroke-width="3"/><text x="878" y="202" text-anchor="middle" class="label">E2B Sandbox</text><rect x="770" y="230" width="215" height="88" rx="18" fill="#fff" stroke="#d79aba" stroke-width="2"/><text x="878" y="263" text-anchor="middle" class="mono">print(sum(...))</text><text x="878" y="294" text-anchor="middle" class="small">隔离环境中执行</text><path d="M1035 260 H1125" class="arrowP"/><rect x="1135" y="190" width="210" height="140" rx="22" fill="url(#green)" stroke="#25b67d" stroke-width="2"/><text x="1240" y="235" text-anchor="middle" class="label">工具结果</text><text x="1240" y="274" text-anchor="middle" class="mono">333383335000</text><text x="1240" y="304" text-anchor="middle" class="small">再交回模型</text><rect x="135" y="450" width="500" height="205" rx="24" fill="url(#yellow)" stroke="#e2ad2d" stroke-width="2"/><text x="385" y="494" text-anchor="middle" class="label">危险做法：直接在服务器 exec()</text><text x="385" y="535" text-anchor="middle" class="small">模型代码与 .env / 项目文件 / 系统权限</text><text x="385" y="566" text-anchor="middle" class="small">处在同一个真实运行环境</text><text x="385" y="611" text-anchor="middle" class="mono">exec(model_generated_code)</text><rect x="765" y="450" width="500" height="205" rx="24" fill="url(#green)" stroke="#25b67d" stroke-width="2"/><text x="1015" y="494" text-anchor="middle" class="label">教学版安全边界：Sandbox</text><text x="1015" y="535" text-anchor="middle" class="small">代码放进隔离执行环境</text><text x="1015" y="566" text-anchor="middle" class="small">真实项目仍需考虑网络、文件、资源、超时等权限</text><text x="1015" y="611" text-anchor="middle" class="mono">Sandbox.create() → run_code()</text><text x="700" y="710" text-anchor="middle" class="sub">核心思想：LLM 可以提出代码，但执行能力必须放在受控边界里</text></svg>