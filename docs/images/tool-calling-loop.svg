</style>
<text x="700" y="58" text-anchor="middle" class="title">Agent 为什么会调用工具？</text><text x="700" y="94" text-anchor="middle" class="subtitle">Tool Calling + Agent Loop 的最小闭环</text><line x1="555" y1="108" x2="845" y2="108" class="guide"/>
<g><rect x="45" y="150" width="180" height="140" rx="18" fill="url(#blue)" stroke="#56a9ef" stroke-width="2"/></g><use href="#user" x="111" y="164" width="48" height="48"/><text x="135" y="230" text-anchor="middle" class="label">用户任务</text><text x="135" y="257" text-anchor="middle" class="small">提出问题或需求</text><path d="M225 220 H310" class="arrow"/>
<g><rect x="320" y="145" width="250" height="150" rx="18" fill="url(#purple)" stroke="#8065e8" stroke-width="2"/></g><use href="#robot" x="421" y="159" width="48" height="48"/><text x="445" y="225" text-anchor="middle" class="label">Responses API / 大模型</text><text x="445" y="252" text-anchor="middle" class="small">理解任务，决定下一步</text><path d="M570 220 H655" class="arrow"/>
<polygon points="750,145 835,220 750,295 665,220" fill="url(#yellow)" stroke="#e8a61a" stroke-width="2"/><text x="750" y="213" text-anchor="middle" class="label"><tspan x="750">能直接</tspan><tspan x="750" dy="24">回答吗？</tspan></text><path d="M835 220 H1010" class="arrowGreen"/><text x="910" y="198" class="branch" fill="#168c67">能</text>
<g><rect x="1020" y="155" width="180" height="125" rx="18" fill="url(#green)" stroke="#27b67d" stroke-width="2"/></g><use href="#doc" x="1090" y="169" width="40" height="40"/><text x="1110" y="214" text-anchor="middle" class="label">直接生成回答</text><text x="1110" y="241" text-anchor="middle" class="small">基于已有知识</text><path d="M1200 220 H1250" class="arrow"/><g><rect x="1260" y="155" width="110" height="125" rx="18" fill="url(#blue)" stroke="#56a9ef" stroke-width="2"/></g><use href="#browser" x="1296" y="169" width="38" height="38"/><text x="1315" y="218" text-anchor="middle" class="label">返回用户</text>
<path d="M750 295 V350" class="arrowPurple"/><text x="770" y="327" class="branch" fill="#6b52dd">不能</text><g><rect x="610" y="350" width="280" height="90" rx="18" fill="url(#purple)" stroke="#8065e8" stroke-width="2"/></g><use href="#code" x="730" y="364" width="40" height="40"/><text x="750" y="398" text-anchor="middle" class="label">发起 function_call</text><text x="750" y="425" text-anchor="middle" class="small">模型选择合适工具</text><path d="M750 440 V480" class="arrowPurple"/>
<g><rect x="630" y="480" width="240" height="85" rx="18" fill="url(#blue)" stroke="#56a9ef" stroke-width="2"/></g><use href="#folder" x="732" y="494" width="36" height="36"/><text x="750" y="525" text-anchor="middle" class="label">Tool Registry</text><text x="750" y="552" text-anchor="middle" class="small">工具注册表</text>
<path d="M750 565 V600 H520" class="arrowGreen"/><path d="M750 565 V600 H760" class="arrow"/><path d="M750 565 V600 H1010" class="arrowPink"/>
<g><rect x="430" y="605" width="180" height="95" rx="18" fill="url(#green)" stroke="#27b67d" stroke-width="2"/></g><use href="#clock" x="502" y="619" width="36" height="36"/><text x="520" y="660" text-anchor="middle" class="label">get_server_time</text>
<g><rect x="670" y="605" width="180" height="95" rx="18" fill="url(#yellow)" stroke="#e2a31d" stroke-width="2"/></g><use href="#calc" x="742" y="619" width="36" height="36"/><text x="760" y="660" text-anchor="middle" class="label">add_numbers</text>
<g><rect x="910" y="605" width="190" height="95" rx="18" fill="url(#pink)" stroke="#e55c9a" stroke-width="2"/></g><use href="#code" x="987" y="619" width="36" height="36"/><text x="1005" y="660" text-anchor="middle" class="label">run_python</text><path d="M1100 652 H1160" class="arrowPink"/>
<g><rect x="1170" y="605" width="190" height="95" rx="18" fill="url(#pink)" stroke="#e55c9a" stroke-width="2"/></g><use href="#cube" x="1247" y="619" width="36" height="36"/><text x="1265" y="660" text-anchor="middle" class="label">E2B Sandbox</text>
<path d="M520 700 V748 H765" class="arrowGreen"/><path d="M760 700 V748" class="arrow"/><path d="M1005 700 V748 H765" class="arrowPink"/><path d="M1265 700 V748 H765" class="arrowPink"/><g><rect x="670" y="715" width="190" height="68" rx="18" fill="url(#blue)" stroke="#56a9ef" stroke-width="2"/></g><use href="#doc" x="750" y="729" width="30" height="30"/><text x="765" y="757" text-anchor="middle" class="label">工具结果</text><path d="M860 749 H960" class="arrow"/><g><rect x="970" y="715" width="260" height="68" rx="18" fill="url(#purple)" stroke="#8065e8" stroke-width="2"/></g><text x="1100" y="757" text-anchor="middle" class="label">function_call_output</text><path d="M1230 749 H1360 V390 H890" class="arrowPurple"/><text x="1110" y="410" class="label" fill="#5e48cc">把真实结果交回模型</text><text x="1110" y="435" class="small">继续思考，决定下一步</text>
<g><rect x="45" y="475" width="315" height="220" rx="20" fill="#fbfdff" stroke="#9bbced" stroke-width="2" stroke-dasharray="8 7"/></g><text x="72" y="530" class="label">Agent = LLM + Tools +</text><text x="72" y="560" class="label">Loop + State + Sandbox</text><line x1="72" y1="590" x2="330" y2="590" stroke="#a7b8d4" stroke-width="2"/><text x="72" y="625" class="small"><tspan x="72">模型负责判断，程序负责执行。</tspan><tspan x="72" dy="23">真实工具结果会再次交回模型。</tspan><tspan x="72" dy="23">循环直到任务完成。</tspan></text>
</svg>