<style>
  .title{font:700 42px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#123b86}
  .subtitle{font:500 22px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#5b75a6}
  .label{font:700 21px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#102d64}
  .small{font:500 15px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#60749a}
  .tiny{font:600 13px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#38547f}
  .branch{font:700 16px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif}
  .arrow{fill:none;stroke:#3398ef;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
  .arrowPurple{fill:none;stroke:#7057e8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}
  .arrowGreen{fill:none;stroke:#20b987;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
  .arrowPink{fill:none;stroke:#e55c9a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPink)}
