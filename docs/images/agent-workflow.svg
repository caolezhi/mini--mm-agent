<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><rect width="100%" height="100%" fill="#ffffff"/><defs>
      <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#e8f4ff"/></linearGradient>
      <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fff9"/><stop offset="1" stop-color="#e6faef"/></linearGradient>
      <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf9ff"/><stop offset="1" stop-color="#eee8ff"/></linearGradient>
      <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#fff3cf"/></linearGradient>
      <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffafd"/><stop offset="1" stop-color="#ffe8f1"/></linearGradient>
