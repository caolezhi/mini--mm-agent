      <symbol id="server" viewBox="0 0 64 64"><rect x="10" y="8" width="44" height="13" rx="5" fill="#8bc3ff" stroke="#2766b8" stroke-width="3"/><rect x="10" y="25" width="44" height="13" rx="5" fill="#8bc3ff" stroke="#2766b8" stroke-width="3"/><rect x="10" y="42" width="44" height="13" rx="5" fill="#8bc3ff" stroke="#2766b8" stroke-width="3"/><circle cx="18" cy="14.5" r="2" fill="#fff"/><circle cx="18" cy="31.5" r="2" fill="#fff"/><circle cx="18" cy="48.5" r="2" fill="#fff"/></symbol>
      <symbol id="robot" viewBox="0 0 72 64"><line x1="36" y1="4" x2="36" y2="12" stroke="#2766b8" stroke-width="3"/><circle cx="36" cy="4" r="3" fill="#8ee7ff" stroke="#2766b8" stroke-width="2"/><rect x="10" y="13" width="52" height="39" rx="15" fill="#dff4ff" stroke="#2766b8" stroke-width="3"/><rect x="18" y="21" width="36" height="22" rx="10" fill="#163d79"/><circle cx="29" cy="32" r="3" fill="#7df1ed"/><circle cx="43" cy="32" r="3" fill="#7df1ed"/><path d="M31 38 Q36 42 41 38" fill="none" stroke="#7df1ed" stroke-width="2"/></symbol>
      <symbol id="doc" viewBox="0 0 56 64"><path d="M10 5 H36 L48 17 V58 H10 Z" fill="#fff" stroke="#2766b8" stroke-width="3"/><path d="M36 5 V17 H48" fill="#e4f1ff" stroke="#2766b8" stroke-width="3"/><line x1="18" y1="29" x2="39" y2="29" stroke="#70ace7" stroke-width="3"/><line x1="18" y1="38" x2="39" y2="38" stroke="#70ace7" stroke-width="3"/><line x1="18" y1="47" x2="33" y2="47" stroke="#70ace7" stroke-width="3"/></symbol>
      <symbol id="folder" viewBox="0 0 64 52"><path d="M6 15 H28 L34 9 H58 V44 H6 Z" fill="#ffd46c" stroke="#2766b8" stroke-width="3" stroke-linejoin="round"/><path d="M6 17 H58 L53 45 H9 Z" fill="#ffe28f" stroke="#2766b8" stroke-width="3" stroke-linejoin="round"/></symbol>
