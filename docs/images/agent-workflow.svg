      <symbol id="user" viewBox="0 0 70 64"><circle cx="30" cy="20" r="12" fill="#ffd8c5" stroke="#38547f" stroke-width="2"/><path d="M19 18 Q24 4 38 11 Q44 15 40 22" fill="#20334d"/><path d="M12 58 Q15 37 30 35 Q47 36 52 58" fill="#8bc3ff" stroke="#38547f" stroke-width="2"/><rect x="39" y="35" width="25" height="18" rx="3" fill="#dcecff" stroke="#38547f" stroke-width="2"/></symbol>
