<style>
  .title{font:700 42px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#123b86}.subtitle{font:500 22px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#5b75a6}.label{font:700 21px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#102d64}.small{font:500 15px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#60749a}.branch{font:700 16px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif}.arrow{fill:none;stroke:#3398ef;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}.arrowPurple{fill:none;stroke:#7057e8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPurple)}.arrowGreen{fill:none;stroke:#20b987;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}.arrowPink{fill:none;stroke:#e55c9a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowPink)}.guide{stroke:#8fa8ef;stroke-width:3;stroke-linecap:round}
</style>
<text x="700" y="58" text-anchor="middle" class="title">Mini AI Agent 工作流程</text><text x="700" y="94" text-anchor="middle" class="subtitle">一个简单 Agent 是如何工作的？</text><line x1="555" y1="108" x2="845" y2="108" class="guide"/>
<g><rect x="30" y="145" width="150" height="145" rx="18" fill="url(#blue)" stroke="#56a9ef" stroke-width="2"/></g><use href="#user" x="81" y="159" width="48" height="48"/><text x="105" y="225" text-anchor="middle" class="label">用户输入任务</text><text x="105" y="252" text-anchor="middle" class="small">提出问题或需求</text>
<g><rect x="215" y="145" width="150" height="145" rx="18" fill="url(#green)" stroke="#27b67d" stroke-width="2"/></g><use href="#browser" x="266" y="159" width="48" height="48"/><text x="290" y="225" text-anchor="middle" class="label">前端 / 浏览器</text><text x="290" y="252" text-anchor="middle" class="small">展示界面，发送请求</text>
<g><rect x="400" y="145" width="150" height="145" rx="18" fill="url(#blue)" stroke="#56a9ef" stroke-width="2"/></g><use href="#server" x="451" y="159" width="48" height="48"/><text x="475" y="225" text-anchor="middle" class="label">FastAPI 接口</text><text x="475" y="252" text-anchor="middle" class="small">接收并转发请求</text>
<g><rect x="585" y="145" width="170" height="145" rx="18" fill="url(#purple)" stroke="#8065e8" stroke-width="2"/></g><use href="#robot" x="646" y="159" width="48" height="48"/><text x="670" y="225" text-anchor="middle" class="label">Responses API</text><text x="670" y="252" text-anchor="middle" class="small">模型理解与决策</text>
<path d="M180 218 H205" class="arrow"/><path d="M365 218 H390" class="arrow"/><path d="M550 218 H575" class="arrow"/><path d="M755 218 H795" class="arrow"/>
<polygon points="885,145 965,218 885,291 805,218" fill="url(#yellow)" stroke="#e8a61a" stroke-width="2"/><text x="885" y="211" text-anchor="middle" class="label"><tspan x="885">需要工具</tspan><tspan x="885" dy="25">吗？</tspan></text>
<path d="M965 218 H1050" class="arrowGreen"/><text x="1003" y="198" text-anchor="middle" class="branch" fill="#168c67">不需要</text><g><rect x="1060" y="155" width="150" height="126" rx="18" fill="url(#green)" stroke="#27b67d" stroke-width="2"/></g><use href="#doc" x="1114" y="169" width="42" height="42"/><text x="1135" y="235" text-anchor="middle" class="label">直接回答</text><text x="1135" y="262" text-anchor="middle" class="small">模型直接生成</text><path d="M1210 218 H1240" class="arrow"/><g><rect x="1245" y="155" width="130" height="126" rx="18" fill="url(#blue)" stroke="#56a9ef" stroke-width="2"/></g><use href="#browser" x="1289" y="169" width="42" height="42"/><text x="1310" y="235" text-anchor="middle" class="label">返回前端</text><text x="1310" y="262" text-anchor="middle" class="small">展示结果</text>
<path d="M885 291 V350 H815" class="arrowPurple"/><text x="905" y="327" class="branch" fill="#6b52dd">需要</text><g><rect x="650" y="350" width="260" height="92" rx="18" fill="url(#purple)" stroke="#8065e8" stroke-width="2"/></g><use href="#code" x="759" y="364" width="42" height="42"/><text x="780" y="398" text-anchor="middle" class="label">Function Tool</text><text x="780" y="425" text-anchor="middle" class="small">模型选择需要的工具</text><path d="M780 442 V486" class="arrowPurple"/><g><rect x="650" y="486" width="260" height="90" rx="18" fill="url(#blue)" stroke="#56a9ef" stroke-width="2"/></g><use href="#folder" x="759" y="500" width="42" height="42"/><text x="780" y="532" text-anchor="middle" class="label">Tool Registry</text><text x="780" y="559" text-anchor="middle" class="small">根据名称找到 Python 函数</text>
<path d="M780 576 V605 H555" class="arrowGreen"/><path d="M780 576 V605 H780" class="arrow"/><path d="M780 576 V605 H1005" class="arrowPurple"/>
<g><rect x="455" y="610" width="200" height="100" rx="18" fill="url(#green)" stroke="#27b67d" stroke-width="2"/></g><use href="#clock" x="536" y="624" width="38" height="38"/><text x="555" y="660" text-anchor="middle" class="label">get_server_time</text><text x="555" y="687" text-anchor="middle" class="small">获取服务器时间</text>
<g><rect x="680" y="610" width="200" height="100" rx="18" fill="url(#yellow)" stroke="#e2a31d" stroke-width="2"/></g><use href="#calc" x="761" y="624" width="38" height="38"/><text x="780" y="660" text-anchor="middle" class="label">add_numbers</text><text x="780" y="687" text-anchor="middle" class="small">计算两个数字</text>
<g><rect x="905" y="610" width="200" height="100" rx="18" fill="url(#purple)" stroke="#8065e8" stroke-width="2"/></g><use href="#code" x="986" y="624" width="38" height="38"/><text x="1005" y="660" text-anchor="middle" class="label">run_python</text><text x="1005" y="687" text-anchor="middle" class="small">执行 Python 代码</text><path d="M1105 660 H1165" class="arrowPink"/><g><rect x="1170" y="610" width="190" height="100" rx="18" fill="url(#pink)" stroke="#e55c9a" stroke-width="2"/></g><use href="#cube" x="1246" y="624" width="38" height="38"/><text x="1265" y="660" text-anchor="middle" class="label">E2B Sandbox</text><text x="1265" y="687" text-anchor="middle" class="small">隔离代码执行环境</text>
<path d="M555 710 V745 H750" class="arrowGreen"/><path d="M780 710 V745" class="arrow"/><path d="M1005 710 V745 H750" class="arrowPurple"/><path d="M1265 710 V745 H750" class="arrowPink"/><g><rect x="650" y="720" width="200" height="70" rx="18" fill="url(#blue)" stroke="#56a9ef" stroke-width="2"/></g><use href="#doc" x="733" y="734" width="34" height="34"/><text x="750" y="762" text-anchor="middle" class="label">工具结果</text><path d="M850 755 H950" class="arrow"/><g><rect x="955" y="720" width="270" height="70" rx="18" fill="url(#purple)" stroke="#8065e8" stroke-width="2"/></g><text x="1090" y="762" text-anchor="middle" class="label">function_call_output</text><path d="M1225 755 H1360 V390 H910" class="arrowPurple"/><text x="1180" y="410" class="small" fill="#6b52dd">结果回到模型，继续推理</text><path d="M910 395 H1060" class="arrowPurple"/><g><rect x="1070" y="342" width="160" height="104" rx="18" fill="url(#pink)" stroke="#e55c9a" stroke-width="2"/></g><use href="#doc" x="1131" y="356" width="38" height="38"/><text x="1150" y="398" text-anchor="middle" class="label">最终回答</text><text x="1150" y="425" text-anchor="middle" class="small">基于工具结果</text><path d="M1230 394 H1260" class="arrow"/><g><rect x="1265" y="342" width="110" height="104" rx="18" fill="url(#blue)" stroke="#56a9ef" stroke-width="2"/></g><use href="#browser" x="1303" y="356" width="34" height="34"/><text x="1320" y="401" text-anchor="middle" class="label">返回前端</text>
</svg>