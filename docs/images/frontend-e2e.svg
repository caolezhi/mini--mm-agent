<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="100%" height="100%" fill="#fff"/><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#e8f4ff"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fff9"/><stop offset="1" stop-color="#e5faef"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf9ff"/><stop offset="1" stop-color="#eee8ff"/></linearGradient><linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#fff2cd"/></linearGradient><linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffafd"/><stop offset="1" stop-color="#ffe8f1"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b95eb"/></marker><marker id="arrowP" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7158e8"/></marker></defs><style>.title{font:700 42px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#123b86}.sub{font:500 21px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#647ba8}.label{font:700 21px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#102d64}.small{font:500 15px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#60749a}.mono{font:600 16px Consolas,"SFMono-Regular",monospace;fill:#533fb8}.arrow{fill:none;stroke:#3b95eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.arrowP{fill:none;stroke:#7158e8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowP)}</style><text x="700" y="58" text-anchor="middle" class="title">从网页点“发送”以后，整个 Agent 怎么跑？</text><text x="700" y="94" text-anchor="middle" class="sub">Frontend → FastAPI → Agent Loop → Tool → Result → Frontend</text><line x1="505" y1="110" x2="895" y2="110" stroke="#9aacef" stroke-width="3" stroke-linecap="round"/><rect x="45" y="185" width="200" height="145" rx="22" fill="url(#green)" stroke="#25b67d" stroke-width="2"/><text x="145" y="228" text-anchor="middle" class="label">浏览器前端</text><text x="145" y="265" text-anchor="middle" class="mono">fetch('/agent')</text><text x="145" y="298" text-anchor="middle" class="small">session_id + input</text><path d="M245 258 H330" class="arrow"/><rect x="340" y="185" width="200" height="145" rx="22" fill="url(#blue)" stroke="#56a9ef" stroke-width="2"/><text x="440" y="228" text-anchor="middle" class="label">FastAPI Route</text><text x="440" y="265" text-anchor="middle" class="mono">POST /agent</text><text x="440" y="298" text-anchor="middle" class="small">Pydantic 验证请求</text><path d="M540 258 H625" class="arrow"/><rect x="635" y="185" width="220" height="145" rx="22" fill="url(#purple)" stroke="#8065e8" stroke-width="2"/><text x="745" y="228" text-anchor="middle" class="label">Agent Service</text><text x="745" y="265" text-anchor="middle" class="small">读取 session 状态</text><text x="745" y="298" text-anchor="middle" class="small">进入 Agent Loop</text><path d="M855 258 H940" class="arrowP"/><rect x="950" y="185" width="210" height="145" rx="22" fill="url(#yellow)" stroke="#e2ad2d" stroke-width="2"/><text x="1055" y="228" text-anchor="middle" class="label">Responses API</text><text x="1055" y="265" text-anchor="middle" class="small">文本 or function_call</text><text x="1055" y="298" text-anchor="middle" class="small">继续推理</text><path d="M1160 258 H1245" class="arrowP"/><rect x="1255" y="185" width="105" height="145" rx="22" fill="url(#pink)" stroke="#d95b98" stroke-width="2"/><text x="1308" y="230" text-anchor="middle" class="label">Tools</text><text x="1308" y="268" text-anchor="middle" class="small">E2B</text><text x="1308" y="298" text-anchor="middle" class="small">Python</text><path d="M1308 330 V420 H1055 V350" class="arrowP"/><text x="1185" y="405" text-anchor="middle" class="small">function_call_output</text><rect x="360" y="470" width="680" height="150" rx="26" fill="#fbfdff" stroke="#cedcf0" stroke-width="2" stroke-dasharray="7 7"/><text x="700" y="512" text-anchor="middle" class="label">状态与浏览器体验</text><rect x="400" y="540" width="180" height="54" rx="14" fill="url(#blue)" stroke="#56a9ef"/><text x="490" y="573" text-anchor="middle" class="small">SQLite 保存 session</text><rect x="610" y="540" width="180" height="54" rx="14" fill="url(#green)" stroke="#25b67d"/><text x="700" y="573" text-anchor="middle" class="small">localStorage 保存 id</text><rect x="820" y="540" width="180" height="54" rx="14" fill="url(#purple)" stroke="#8065e8"/><text x="910" y="573" text-anchor="middle" class="small">最终 output 显示页面</text><path d="M1055 330 V675 H745" class="arrow"/><path d="M745 675 H145 V350" class="arrow"/><text x="590" y="700" text-anchor="middle" class="sub">最终回答经过 FastAPI 返回，前端再把 data.output 写到页面</text></svg>