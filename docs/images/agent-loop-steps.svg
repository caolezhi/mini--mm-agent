<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><rect width="100%" height="100%" fill="#ffffff"/><defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#e9f4ff"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf9ff"/><stop offset="1" stop-color="#eee8ff"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fff9"/><stop offset="1" stop-color="#e5faef"/></linearGradient><linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#fff2cd"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b95eb"/></marker><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7158e8"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#22af80"/></marker></defs><style>.title{font:700 43px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#123b86}.sub{font:500 21px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#647ba8}.label{font:700 23px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#102d64}.small{font:500 16px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#60749a}.mono{font:600 16px Consolas,"SFMono-Regular",monospace;fill:#4d3fa9}.arrow{fill:none;stroke:#3b95eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#a)}.arrowP{fill:none;stroke:#7158e8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#p)}.arrowG{fill:none;stroke:#22af80;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#g)}</style><text x="700" y="60" text-anchor="middle" class="title">Agent Loop 一轮一轮发生了什么？</text><text x="700" y="98" text-anchor="middle" class="sub">模型判断 → 工具执行 → 结果回模型 → 再判断</text><line x1="500" y1="114" x2="900" y2="114" stroke="#9aacef" stroke-width="3" stroke-linecap="round"/><rect x="70" y="200" width="220" height="135" rx="22" fill="url(#blue)" stroke="#56a9ef" stroke-width="2"/><text x="180" y="244" text-anchor="middle" class="label">① 用户任务</text><text x="180" y="286" text-anchor="middle" class="small">例如：获取时间后再计算</text><path d="M290 267 H390" class="arrow"/><rect x="400" y="185" width="250" height="165" rx="22" fill="url(#purple)" stroke="#8065e8" stroke-width="2"/><text x="525" y="230" text-anchor="middle" class="label">② 调用模型</text><text x="525" y="270" text-anchor="middle" class="mono">Responses API</text><text x="525" y="307" text-anchor="middle" class="small">模型决定下一步</text><path d="M650 267 H740" class="arrowP"/><polygon points="845,190 950,267 845,344 740,267" fill="url(#yellow)" stroke="#e4a522" stroke-width="2"/><text x="845" y="254" text-anchor="middle" class="label"><tspan x="845">有</tspan><tspan x="845" dy="27">function_call？</tspan></text><path d="M950 267 H1080" class="arrowG"/><text x="1005" y="245" class="small" fill="#168c67">没有</text><rect x="1090" y="200" width="240" height="135" rx="22" fill="url(#green)" stroke="#27b67d" stroke-width="2"/><text x="1210" y="246" text-anchor="middle" class="label">③ 最终回答</text><text x="1210" y="288" text-anchor="middle" class="small">response.output_text</text><path d="M845 344 V435" class="arrowP"/><text x="865" y="393" class="small" fill="#6b52dd">有</text><rect x="700" y="445" width="290" height="130" rx="22" fill="url(#blue)" stroke="#56a9ef" stroke-width="2"/><text x="845" y="486" text-anchor="middle" class="label">④ 执行工具</text><text x="845" y="525" text-anchor="middle" class="small">Tool Registry → Python 函数</text><text x="845" y="553" text-anchor="middle" class="small">得到真实工具结果</text><path d="M700 510 H545" class="arrow"/><rect x="260" y="445" width="275" height="130" rx="22" fill="url(#purple)" stroke="#8065e8" stroke-width="2"/><text x="398" y="486" text-anchor="middle" class="label">⑤ 包装结果</text><text x="398" y="525" text-anchor="middle" class="mono">function_call_output</text><text x="398" y="553" text-anchor="middle" class="small">带上对应 call_id</text><path d="M398 445 V385 H525 V350" class="arrowP"/><text x="520" y="405" class="small">previous_response_id = response.id</text><rect x="260" y="635" width="800" height="90" rx="22" fill="#fbfdff" stroke="#cad9ed" stroke-width="2" stroke-dasharray="7 7"/><text x="660" y="675" text-anchor="middle" class="label">停止条件</text><text x="660" y="706" text-anchor="middle" class="small">没有 function_call → 完成；超过 max_steps → 强制停止</text></svg>