<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Mini Agent</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        #messages {
            border: 1px solid #ddd;
            height: 480px;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 20px;
        }

        .user {
            margin: 10px 0;
            font-weight: bold;
        }

        .assistant {
            margin: 10px 0 25px;
            white-space: pre-wrap;
        }

        #input-area {
            display: flex;
            gap: 10px;
        }

        #message-input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Mini Agent</h1>

    <div id="messages"></div>

    <div id="input-area">
        <input
            id="message-input"
            placeholder="输入任务..."
        >
        <button id="send-button">发送</button>
    </div>

    <script>
        const input = document.getElementById("message-input");
        const button = document.getElementById("send-button");
        const messages = document.getElementById("messages");

        // Each browser keeps its own session id so multi-turn context does not
        // accidentally mix with another browser/user.
        const sessionId =
            localStorage.getItem("mini-agent-session")
            || crypto.randomUUID();

        localStorage.setItem(
            "mini-agent-session",
            sessionId
        );

        function addMessage(role, text) {
            const div = document.createElement("div");
            div.className = role;

            if (role === "user") {
                div.textContent = "你：" + text;
            } else {
                div.textContent = "Agent：" + text;
            }

            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        async function sendMessage() {
            const message = input.value.trim();

            if (!message) {
                return;
            }

            addMessage("user", message);

            input.value = "";
            button.disabled = true;
            button.textContent = "Agent工作中...";

            try {
                const response = await fetch(
                    "http://127.0.0.1:8001/agent",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            session_id: sessionId,
                            input: message
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "请求失败"
                    );
                }

                addMessage(
                    "assistant",
                    data.output
                );

            } catch (error) {
                addMessage(
                    "assistant",
                    "发生错误：" + error.message
                );

            } finally {
                button.disabled = false;
                button.textContent = "发送";
            }
        }

        button.addEventListener(
            "click",
            sendMessage
        );

        input.addEventListener(
            "keydown",
            function (event) {
                if (event.key === "Enter") {
                    sendMessage();
                }
            }
        );
    </script>
</body>
</html>
