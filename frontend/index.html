<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Agent</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f7f9fc;
            color: #1f2a44;
        }

        .app {
            width: min(900px, calc(100% - 32px));
            margin: 40px auto;
        }

        .header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .subtitle {
            margin: 0;
            color: #667795;
        }

        #session-label {
            margin-top: 10px;
            font-size: 13px;
            color: #8390a8;
            font-family: Consolas, monospace;
        }

        #messages {
            min-height: 500px;
            max-height: 65vh;
            overflow-y: auto;
            padding: 24px;
            border: 1px solid #dce4f0;
            border-radius: 18px;
            background: white;
            box-shadow: 0 10px 28px rgba(48, 82, 130, 0.08);
        }

        .message {
            margin: 0 0 20px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .message strong {
            display: block;
            margin-bottom: 4px;
        }

        .user strong {
            color: #2866b5;
        }

        .assistant strong {
            color: #6d53cf;
        }

        #input-area {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        #message-input {
            flex: 1;
            min-width: 0;
            padding: 13px 14px;
            border: 1px solid #cbd7e7;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        #message-input:focus {
            border-color: #4a8bd8;
            box-shadow: 0 0 0 3px rgba(74, 139, 216, 0.12);
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        #send-button {
            background: #2866b5;
            color: white;
        }

        #new-session-button {
            background: white;
            color: #475875;
            border: 1px solid #cbd7e7;
        }

        .empty-tip {
            color: #8a97ad;
            text-align: center;
            margin-top: 200px;
        }

        @media (max-width: 700px) {
            .header,
            #input-area {
                flex-direction: column;
            }

            #input-area button,
            #message-input {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <div class="header">
            <div>
                <h1>Mini Agent</h1>
                <p class="subtitle">Responses API + Tool Calling + E2B Sandbox</p>
                <div id="session-label"></div>
            </div>

            <button id="new-session-button">
                新会话
            </button>
        </div>

        <div id="messages">
            <div id="empty-tip" class="empty-tip">
                输入一个任务，观察 Agent 是否会调用工具。
            </div>
        </div>

        <div id="input-area">
            <input
                id="message-input"
                placeholder="例如：请使用 Python 计算 1 到 10000 所有整数的平方和"
                autocomplete="off"
            >

            <button id="send-button">
                发送
            </button>
        </div>
    </main>

    <script>
        const input = document.getElementById("message-input");
        const sendButton = document.getElementById("send-button");
        const newSessionButton = document.getElementById("new-session-button");
        const messages = document.getElementById("messages");
        const sessionLabel = document.getElementById("session-label");

        let sessionId =
            localStorage.getItem("mini-agent-session")
            || crypto.randomUUID();

        localStorage.setItem(
            "mini-agent-session",
            sessionId
        );

        function renderSessionId() {
            sessionLabel.textContent =
                "Session: " + sessionId.slice(0, 8);
        }

        function removeEmptyTip() {
            const emptyTip = document.getElementById("empty-tip");

            if (emptyTip) {
                emptyTip.remove();
            }
        }

        function addMessage(role, text) {
            removeEmptyTip();

            const div = document.createElement("div");
            const label = document.createElement("strong");
            const content = document.createElement("span");

            div.className = "message " + role;
            label.textContent = role === "user" ? "你" : "Agent";
            content.textContent = text;

            div.appendChild(label);
            div.appendChild(content);
            messages.appendChild(div);

            messages.scrollTop = messages.scrollHeight;
        }

        async function sendMessage() {
            const message = input.value.trim();

            if (!message || sendButton.disabled) {
                return;
            }

            addMessage("user", message);
            input.value = "";

            sendButton.disabled = true;
            newSessionButton.disabled = true;
            sendButton.textContent = "Agent工作中...";

            try {
                const response = await fetch(
                    "http://127.0.0.1:8001/agent",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            session_id: sessionId,
                            input: message
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "请求失败"
                    );
                }

                addMessage(
                    "assistant",
                    data.output
                );

            } catch (error) {
                addMessage(
                    "assistant",
                    "发生错误：" + error.message
                );

            } finally {
                sendButton.disabled = false;
                newSessionButton.disabled = false;
                sendButton.textContent = "发送";
                input.focus();
            }
        }

        async function startNewSession() {
            if (newSessionButton.disabled) {
                return;
            }

            const oldSessionId = sessionId;

            newSessionButton.disabled = true;

            try {
                const response = await fetch(
                    "http://127.0.0.1:8001/responses/reset",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            session_id: oldSessionId
                        })
                    }
                );

                if (!response.ok) {
                    console.warn(
                        "旧会话清理失败，仍将创建新 session。"
                    );
                }

            } catch (error) {
                console.warn(
                    "旧会话清理失败：",
                    error
                );
            }

            sessionId = crypto.randomUUID();

            localStorage.setItem(
                "mini-agent-session",
                sessionId
            );

            messages.innerHTML = "";
            renderSessionId();
            addMessage(
                "assistant",
                "已开始新会话。"
            );

            newSessionButton.disabled = false;
            input.focus();
        }

        sendButton.addEventListener(
            "click",
            sendMessage
        );

        newSessionButton.addEventListener(
            "click",
            startNewSession
        );

        input.addEventListener(
            "keydown",
            function (event) {
                if (event.key === "Enter") {
                    sendMessage();
                }
            }
        );

        renderSessionId();
        input.focus();
    </script>
</body>
</html>
